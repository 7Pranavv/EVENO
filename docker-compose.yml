# Local stack: Mongo + API + web.
#
#   cp .env.example .env    # fill in Descope and Razorpay values
#   docker compose up --build
#
# Frontend: http://localhost:3000   API: http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      # Exposed so you can point Compass or `npm run seed` at it from the host.
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        # Without this the API starts first, fails to connect, and exits —
        # config/db.ts treats an unreachable database as fatal.
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/eveno
      DESCOPE_PROJECT_ID: ${DESCOPE_PROJECT_ID:?set DESCOPE_PROJECT_ID in .env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      PORT: "8080"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time, not runtime: these get inlined into the browser bundle.
        # Change one and you must rebuild (`docker compose build frontend`),
        # not just restart.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
        NEXT_PUBLIC_DESCOPE_PROJECT_ID: ${DESCOPE_PROJECT_ID:?set DESCOPE_PROJECT_ID in .env}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo-data:
