# Single-node MongoDB with a persistent volume.
#
# This is fine for a demo, a staging cluster, or a self-hosted deployment where
# you own the backups. For production, point MONGO_URI at a managed service
# (Atlas or equivalent) and skip this file — one pod means downtime during any
# node drain, and nothing here takes backups.
#
# The app uses no multi-document transactions, so a single node (rather than a
# replica set) is sufficient.
apiVersion: v1
kind: Service
metadata:
  name: eveno-mongo
  namespace: eveno
spec:
  # Headless: gives each pod a stable DNS name (eveno-mongo-0.eveno-mongo),
  # which is what MONGO_URI points at.
  clusterIP: None
  selector:
    app: eveno-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eveno-mongo
  namespace: eveno
spec:
  serviceName: eveno-mongo
  replicas: 1
  selector:
    matchLabels:
      app: eveno-mongo
  template:
    metadata:
      labels:
        app: eveno-mongo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # the `mongodb` user in the official image
        fsGroup: 999            # so the mounted volume is writable
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
